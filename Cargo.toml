[package]
name = "lastai"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Fast local full-text search and resume launcher for Codex and Claude histories"
repository = "https://github.com/gorira-tatsu/lastai"
readme = "README.md"
keywords = ["codex", "claude", "search", "tui"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0"
bincode = "1.3"
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
crossterm = "0.28"
directories = "6.0"
fst = "0.4"
ignore = "0.4"
memmap2 = "0.9"
ratatui = "0.29"
rayon = "1.10"
regex = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
toml = "0.8"
unicode-normalization = "0.1"

[dev-dependencies]
criterion = "0.5"
tempfile = "3.14"

[[bench]]
name = "search_bench"
harness = false

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

[workspace.metadata.dist]
cargo-dist-version = "0.28.0"
ci = ["github"]
installers = ["shell", "homebrew"]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
]
